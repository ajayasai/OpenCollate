schema_version = 1

[project]
name = "synthetic-uart"
root = "."

[sources.rtl.default]
files = ["rtl/uart.sv"]
include_dirs = []
defines = []
top = "uart"

[sources.liberty.tt]
files = ["lib/uart.lib"]

[sources.lef.abstract]
files = ["lef/uart.lef"]

[sources.csv.package]
files = ["package/pins.csv"]
profile = "package_map"

[sources.csv.package.columns]
die_pad = "Pad"
package_ball = "Ball"
signal = "Signal"
component = "Component"

[sources.ipxact.component]
files = ["ipxact/uart.xml"]

[sources.sdc.functional]
files = ["constraints/uart.sdc"]

[sources.upf.power]
files = ["power/uart.upf"]

[sources.header.software]
files = ["software/uart_regs.h"]
component_name = "uart"
macro_prefix = "UART"
default_register_width = 32

[sources.systemrdl.registers]
files = ["registers/uart.rdl"]
top = "uart_registers"
component_name = "uart"

[sources.connectivity.intent]
files = ["connectivity/requirements.csv"]

[sources.cdl.netlist]
files = ["netlist/uart.cdl"]

[sources.def.placed]
files = ["physical/uart.def"]

[sources.gds.stream]
files = ["physical/uart.gds"]
top_cells = ["uart"]
pin_text_layers = [10]
pin_text_types = [5]

[contract]
baseline = "rtl.default"

[policy]
strict_inventory = false
rtl_power_pins = "optional"
scalar_vector_equivalent = false
max_boolean_inputs = 12
