name: Proof development snapshot
on:
  push:
    branches: [feat/independent-proof-certificates]
    paths: [.github/workflows/proof-development-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Package optional public proof dependencies
        run: |
          mkdir -p wheels
          python -m pip download --only-binary=:all: --dest wheels 'python-sat>=1.8.dev13,<2' editables
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-optional-dependencies
          path: wheels/
          retention-days: 2
          if-no-files-found: error
