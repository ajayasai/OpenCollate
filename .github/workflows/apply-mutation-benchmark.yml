name: Apply semantic mutation benchmark

on:
  push:
    branches:
      - "feat/mutation-evidence-benchmark"

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

concurrency:
  group: apply-semantic-mutation-benchmark
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply exact final normalization
        run: python tools/fix_mutation_benchmark.py
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Format benchmark and tests
        run: ruff format benchmarks/mutations.py tests/test_mutation_benchmark.py
      - name: Static quality gates
        run: |
          python -m py_compile benchmarks/mutations.py
          ruff format --check src tests benchmarks/mutations.py
          ruff check src tests benchmarks/mutations.py
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
      - name: Enforce semantic mutation oracle
        run: >-
          python benchmarks/mutations.py
          --enforce-perfect
          --json-output mutation-results.json
      - name: Run existing public conformance suite
        run: >-
          python benchmarks/run.py
          --repeat 1
          --warmup 0
          --diff-groups 20
          --json-output benchmark-results.json
      - name: Run complete test suite with explicit exit capture
        run: |
          set +e
          pytest -q > mutation-benchmark-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > mutation-benchmark-tests.status
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-mutation-verification
          path: |
            mutation-results.json
            benchmark-results.json
            mutation-benchmark-tests.log
            mutation-benchmark-tests.status
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce complete test result
        run: test "$(cat mutation-benchmark-tests.status)" -eq 0
      - name: Check patch hygiene
        run: git diff --check
      - name: Remove one-shot implementation files
        run: |
          rm -f .github/workflows/apply-mutation-benchmark.yml
          rm -f .github/workflows/diagnose-mutation-benchmark.yml
          rm -f tools/fix_mutation_benchmark.py
          rm -f mutation-results.json benchmark-results.json
          rm -f mutation-benchmark-tests.log mutation-benchmark-tests.status
      - name: Commit verified benchmark
        run: |
          git config user.name "OpenCollate mutation benchmark"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add oracle-backed semantic mutation benchmark"
          git push origin "HEAD:${GITHUB_REF_NAME}"
