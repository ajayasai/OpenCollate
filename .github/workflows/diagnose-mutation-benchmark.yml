name: Diagnose semantic mutation benchmark

on:
  push:
    branches:
      - "feat/mutation-evidence-benchmark"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check syntax, formatting, lint, and typing
        id: static
        continue-on-error: true
        run: |
          set +e
          python -m py_compile benchmarks/mutations.py > static.log 2>&1
          status=$?
          ruff format --check benchmarks/mutations.py >> static.log 2>&1
          status=$((status | $?))
          ruff check benchmarks/mutations.py >> static.log 2>&1
          status=$((status | $?))
          printf '%s\n' "$status" > static.status
          exit 0
      - name: Run mutation suite with explicit exit capture
        run: |
          set +e
          python benchmarks/mutations.py --enforce-perfect --json-output mutation-results.json > mutation.log 2>&1
          status=$?
          printf '%s\n' "$status" > mutation.status
          exit 0
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-mutation-diagnostics
          path: |
            static.log
            static.status
            mutation.log
            mutation.status
            mutation-results.json
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce static and benchmark results
        run: |
          test "$(cat static.status)" -eq 0
          test "$(cat mutation.status)" -eq 0
