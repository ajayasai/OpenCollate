name: Validate manifest inventory schemas

on:
  push:
    branches: [upgrade/manifest-bound-preprocessing]
    paths: [.github/workflows/apply-manifest-schema-fix.yml]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Apply exact reviewed schema and boundary-test patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          patch = Path('tools/manifest-schema-fix.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != '3aa462e5dddf3fe4db85527abfd6902cefd2c34d836de254b405860dcfc2a2f1':
              raise RuntimeError('reviewed patch integrity mismatch')
          PY
          git apply --check --whitespace=error-all tools/manifest-schema-fix.patch
          git apply --whitespace=error-all tools/manifest-schema-fix.patch
      - name: Verify supported inventory and rejection boundaries
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          ruff check .
          ruff format --check .
          mypy
          pytest -q tests/test_sequential_sources.py tests/test_preprocessing_schema_bounds.py
          python -O -m pytest -q tests/test_preprocessing_schema_bounds.py
      - name: Publish reviewed correction without temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "upgrade/manifest-bound-preprocessing"
          rm -f tools/manifest-schema-fix.patch .github/workflows/apply-manifest-schema-fix.yml
          git diff --check
          git add -A
          git config user.name "OpenCollate verified preprocessing upgrade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: align proof evidence schemas with complete source manifests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
