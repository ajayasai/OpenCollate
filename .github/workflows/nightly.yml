name: Nightly robustness

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  latest:
    name: Latest Python and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install latest allowed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -e ".[dev]"
      - name: Run tests including Hypothesis properties
        run: pytest -q
      - name: Run public conformance and scalability benchmarks
        run: >-
          python benchmarks/run.py
          --repeat 5
          --warmup 1
          --diff-groups 2000
          --enforce-budgets
          --json-output benchmark-results.json
      - name: Upload public benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmarks-python-3.14
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Compile every module
        run: python -m compileall -q src
      - name: Build package
        run: python -m build
