name: Validate manifest-bound preprocessing upgrade

on:
  push:
    branches: [upgrade/manifest-bound-preprocessing]
    paths: [.github/workflows/apply-manifest-upgrade.yml]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify and apply exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path
          names = ('00', '01a', '01b', '02a', '02b', '03a', '03b')
          encoded = ''.join(Path(f'tools/manifest-patch/{name}.b64').read_text(encoding='ascii').strip() for name in names)
          if len(encoded) != 31052:
              raise RuntimeError('source transport length mismatch')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '3247d1c0a4faf82b6c38a6e953cea8ccf2bc63b35dc2f0f9876a8c0ce701ffcc'
          if len(patch) != 102555 or hashlib.sha256(patch).hexdigest() != expected:
              raise RuntimeError('source patch integrity mismatch')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', '-'], input=patch, check=True)
          print('Applied exact source patch SHA-256', expected)
          PY
      - name: Install checker and independent simulator
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Static quality and security
        run: |
          ruff check .
          ruff format --check .
          mypy
          python -m bandit -q -r src/opencollate
      - name: Full tests with coverage and optimized Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest-evidence"
          pytest -q --cov=opencollate --cov-branch --cov-report=json:"$RUNNER_TEMP/manifest-evidence/coverage.json" --junitxml="$RUNNER_TEMP/manifest-evidence/tests.xml" | tee "$RUNNER_TEMP/manifest-evidence/tests.log"
          python -O -m pytest -q | tee "$RUNNER_TEMP/manifest-evidence/optimized.log"
      - name: Source and existing semantic benchmarks
        run: |
          python -m benchmarks.preprocessing --repeat 3 --json-output "$RUNNER_TEMP/manifest-evidence/preprocessing.json"
          python -m benchmarks.controllers --repeat 1 --json-output "$RUNNER_TEMP/manifest-evidence/controllers.json"
          python -m benchmarks.certificates --repeat 1 --json-output "$RUNNER_TEMP/manifest-evidence/certificates.json"
          python benchmarks/mutations.py --enforce-perfect --json-output "$RUNNER_TEMP/manifest-evidence/mutations.json"
          python benchmarks/symbolic.py --json-output "$RUNNER_TEMP/manifest-evidence/symbolic.json"
          python benchmarks/sequential.py --repeat 1 --json-output "$RUNNER_TEMP/manifest-evidence/sequential.json"
      - name: Build distributions and verify solver-free receiver
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          opencollate sequential certify examples/preprocessed/request.json --output "$RUNNER_TEMP/manifest-evidence/proof.json"
          python -m venv "$RUNNER_TEMP/manifest-receiver"
          "$RUNNER_TEMP/manifest-receiver/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/manifest-receiver/bin/python" -I -c "import importlib.util; assert importlib.util.find_spec('z3') is None; assert importlib.util.find_spec('pysat') is None"
          "$RUNNER_TEMP/manifest-receiver/bin/opencollate" sequential verify-certificate examples/preprocessed/request.json "$RUNNER_TEMP/manifest-evidence/proof.json" --output "$RUNNER_TEMP/manifest-evidence/verified.json"
      - name: Preserve measured validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manifest-upgrade-validation
          path: ${{ runner.temp }}/manifest-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Publish validated source without temporary transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "upgrade/manifest-bound-preprocessing"
          rm -rf tools/manifest-patch
          rm -f .github/workflows/apply-manifest-upgrade.yml
          git diff --check
          git add -A
          git config user.name "OpenCollate verified preprocessing upgrade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: bind multi-file RTL preprocessing to proof evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
