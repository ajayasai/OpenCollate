name: Apply contract v2

on:
  push:
    branches:
      - "feat/contract-v2"

permissions:
  contents: write

concurrency:
  group: apply-contract-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply asserted contract transformations
        run: python tools/apply_contract_v2.py
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Format and lint shipped Python
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format --check src tests
          ruff check src tests
      - name: Type-check
        run: mypy src/opencollate
      - name: Security lint
        run: python -m bandit -q -r src/opencollate
      - name: Run complete test suite
        run: pytest -q
      - name: Check patch hygiene
        run: git diff --check
      - name: Remove one-shot bootstrap files
        run: |
          rm -f .github/workflows/apply-contract-v2.yml
          rm -f tools/apply_contract_v2.py
      - name: Commit verified upgrade
        run: |
          git config user.name "OpenCollate contract upgrade"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete integrity-checked contract schema v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
