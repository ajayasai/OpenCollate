name: Apply deterministic parallel parsing

on:
  push:
    branches:
      - "feat/deterministic-parallel-parsing"

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

concurrency:
  group: apply-deterministic-parallel-parsing
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply exact integration
        run: python tools/apply_parallel_parsing.py
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Format shipped Python
        run: ruff format src tests
      - name: Static quality gates
        run: |
          ruff format --check src tests
          ruff check src tests
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
      - name: Run semantic mutation oracle
        run: >-
          python benchmarks/mutations.py
          --enforce-perfect
          --json-output mutation-results.json
      - name: Run public conformance suite
        run: >-
          python benchmarks/run.py
          --repeat 1
          --warmup 0
          --diff-groups 20
          --json-output benchmark-results.json
      - name: Run full tests with explicit exit capture
        run: |
          set +e
          pytest -q > parallel-parsing-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > parallel-parsing-tests.status
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-parallel-parsing-verification
          path: |
            mutation-results.json
            benchmark-results.json
            parallel-parsing-tests.log
            parallel-parsing-tests.status
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce full-suite result
        run: test "$(cat parallel-parsing-tests.status)" -eq 0
      - name: Check patch hygiene
        run: git diff --check
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/apply-parallel-parsing.yml
          rm -f tools/apply_parallel_parsing.py
          rm -f mutation-results.json benchmark-results.json
          rm -f parallel-parsing-tests.log parallel-parsing-tests.status
      - name: Commit verified implementation
        run: |
          git config user.name "OpenCollate parallel parsing"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic bounded parallel parsing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
