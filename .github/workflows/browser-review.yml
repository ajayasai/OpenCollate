name: Browser review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]' 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify browser behavior and offline security
        env:
          OPENCOLLATE_BROWSER_TESTS: "1"
          OPENCOLLATE_DISABLE_PLUGINS: "1"
        run: pytest -q tests/test_html_browser.py
      - name: Verify symbolic conformance
        run: python benchmarks/symbolic.py --json-output symbolic-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbolic-conformance
          path: symbolic-results.json
          retention-days: 30
          if-no-files-found: error
