name: Publish hash-verified certificate integration

on:
  push:
    branches: [upgrade/independent-proof-certificates]
    paths:
      - .github/workflows/publish-tested-certificates.yml
      - .github/independent-proof-publication.patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-tested-integration:
    if: github.repository == 'ajayasai/OpenCollate' && github.ref == 'refs/heads/upgrade/independent-proof-certificates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply only the locally tested integration patch and verify every published file
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          patch = Path('.github/independent-proof-publication.patch').read_bytes()
          patch = patch.replace(b'\n diff --git ', b'\ndiff --git ')
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          expected = {
              '.github/workflows/proof-certificates.yml': '9a59ce915ebe3766ff8ecf669afae712d7d13a71',
              'CHANGELOG.md': '049679bf0cd8e8d78b954b2c82fdb3058bdf8d22',
              'README.md': '8a3ddf26682e4e9817f388033ca9099d073959f9',
              'benchmarks/README.md': 'da00808f42e236c6128e66659eeb2a8128ee6110',
              'benchmarks/certificates.py': '6bc78a6fe534201b302498bd5e6c2e1e8e038f71',
              'docs/competitive-scorecard.md': '58fef74feff1eade0879c66b0287ece3d37a1dcc',
              'docs/proof-certificates.md': 'a51a5083b4d078f6229d4e6923ea2095f6379c35',
              'docs/source-bound-sequential.md': '09d2cd647ed6ab88c068b8dd548023043706985c',
              'pyproject.toml': 'e562b28ea6d6aa217aac53243a9778e401d67e39',
              'src/opencollate/cli.py': '5d8f61ae330da682d543684eea4546d885e03082',
              'src/opencollate/proof_kernel.py': '797538979998438ae5df696645ea2d8909543465',
              'src/opencollate/schemas/certificate-verification.schema.json': '464305fc7b93c05baffbbbf7fdd0f0ef4e3daabd',
              'src/opencollate/schemas/sequential-certificate.schema.json': '2dce3d26f5831144757c30549a7472084a75afb8',
              'src/opencollate/sequential.py': 'a2db449a6740a14845f44b58763f133d6f3775db',
              'src/opencollate/sequential_certificate.py': '1169c702beaf1f44f6ae4380eff28b247f658aa6',
              'src/opencollate/sequential_cnf.py': '8caf25ebf4ad50f360c43c78a04ef02ccf8fd2bf',
              'tests/test_proof_kernel.py': 'fb0f29ff8f9ce53dff56bb3fc60ebd32d36b6c6a',
              'tests/test_sequential_certificates.py': '629b109ee3bd63455cc60d2459b093cb1cd320bf',
              'tests/test_sequential_cnf.py': '72aab21e12fd636da0b1271f3ff1d52c337626ac',
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != wanted:
                  raise SystemExit(f'Published file mismatch: {path}: {actual} != {wanted}')
              print(f'VERIFIED {path} {actual}', flush=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {'CHANGELOG.md', 'README.md', 'benchmarks/README.md', 'docs/competitive-scorecard.md', 'docs/source-bound-sequential.md', 'pyproject.toml', 'src/opencollate/cli.py', 'src/opencollate/sequential.py'}
          if set(changed) != allowed:
              raise SystemExit(f'Unexpected patch paths: {changed}')
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'feat: integrate independently checked source-bound certificates (hash-verified)'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/upgrade/independent-proof-certificates'], check=True)
