name: Validate preprocessing resource correction

on:
  push:
    branches: [upgrade/manifest-bound-preprocessing]
    paths: [.github/workflows/apply-manifest-resource-fix.yml]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          patch = Path('tools/manifest-resource-fix.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != 'd05a4deeef43bce745e734fbffef436d75a60f2298f246a6d288f262f07b55a7':
              raise RuntimeError('audited patch integrity mismatch')
          PY
          git apply --check --whitespace=error-all tools/manifest-resource-fix.patch
          git apply --whitespace=error-all tools/manifest-resource-fix.patch
      - name: Install and check exact implementation
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          ruff check .
          ruff format --check .
          mypy
          python -m bandit -q -r src/opencollate
      - name: Run complete regression and preprocessing oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest-resource-evidence"
          pytest -q --cov=opencollate --cov-branch --cov-report=json:"$RUNNER_TEMP/manifest-resource-evidence/coverage.json" --junitxml="$RUNNER_TEMP/manifest-resource-evidence/tests.xml" | tee "$RUNNER_TEMP/manifest-resource-evidence/tests.log"
          python -O -m pytest -q | tee "$RUNNER_TEMP/manifest-resource-evidence/optimized.log"
          python -m benchmarks.preprocessing --repeat 3 --json-output "$RUNNER_TEMP/manifest-resource-evidence/preprocessing.json"
      - name: Retain measured evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manifest-resource-validation
          path: ${{ runner.temp }}/manifest-resource-evidence
          retention-days: 14
      - name: Publish tested resource correction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "upgrade/manifest-bound-preprocessing"
          rm -f tools/manifest-resource-fix.patch .github/workflows/apply-manifest-resource-fix.yml
          git diff --check
          git add -A
          git config user.name "OpenCollate verified preprocessing upgrade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: enforce shared lexical budget and linear include rewriting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
