name: Validate hierarchical controller upgrade
on:
  push:
    branches: [upgrade/hierarchical-controller-proofs]
    paths:
      - .github/workflows/apply-controller-upgrade.yml
      - tools/apply_controller_upgrade.py
      - tools/controller-patch/**
permissions:
  contents: write
env:
  PYTHONHASHSEED: '0'
  OPENCOLLATE_DISABLE_PLUGINS: '1'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and apply exact source
        run: python tools/apply_controller_upgrade.py
      - name: Install checker and independent simulator
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Static quality and security
        run: |
          ruff format --check src tests benchmarks/controllers.py benchmarks/hierarchy.py
          ruff check src tests benchmarks/controllers.py benchmarks/hierarchy.py
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
      - name: Full tests and optimized Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller-evidence"
          pytest -q --cov=opencollate --cov-branch --cov-report=term --cov-report=json:"$RUNNER_TEMP/controller-evidence/coverage.json" --junitxml="$RUNNER_TEMP/controller-evidence/tests.xml" | tee "$RUNNER_TEMP/controller-evidence/tests.log"
          python -O -m pytest -q | tee "$RUNNER_TEMP/controller-evidence/optimized.log"
      - name: All semantic and source-file benchmarks
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/controller-evidence"
          python -m benchmarks.controllers --repeat 3 --json-output "$EVIDENCE/controllers.json"
          python -m benchmarks.hierarchy --distractors 128 --repeat 3 --json-output "$EVIDENCE/hierarchy.json"
          python -m benchmarks.hierarchy --distractors 0 --repeat 3 --json-output "$EVIDENCE/hierarchy-control.json"
          python -m benchmarks.certificates --repeat 3 --json-output "$EVIDENCE/certificates.json"
          python -m benchmarks.sequential --repeat 3 --json-output "$EVIDENCE/sequential.json"
          python -m benchmarks.symbolic --json-output "$EVIDENCE/symbolic.json"
          python -m benchmarks.mutations --enforce-perfect --json-output "$EVIDENCE/mutations.json"
          python -m benchmarks.upstream_cells --json-output "$EVIDENCE/upstream.json"
          python -m benchmarks.run --repeat 3 --warmup 1 --diff-groups 1000 --enforce-budgets --json-output "$EVIDENCE/conformance.json"
      - name: Build and verify solver-free installed receiver
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          EVIDENCE="$RUNNER_TEMP/controller-evidence"
          opencollate sequential certify examples/controller/request.json --output "$EVIDENCE/controller-proof.json"
          opencollate sequential certify examples/controller/fsm-request.json --output "$EVIDENCE/fsm-proof.json"
          python -m venv "$RUNNER_TEMP/controller-receiver"
          "$RUNNER_TEMP/controller-receiver/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/controller-receiver/bin/python" -I -c "import importlib.util; assert importlib.util.find_spec('pysat') is None; assert importlib.util.find_spec('z3') is None"
          "$RUNNER_TEMP/controller-receiver/bin/opencollate" sequential verify-certificate examples/controller/request.json "$EVIDENCE/controller-proof.json" --output "$EVIDENCE/controller-verified.json"
          "$RUNNER_TEMP/controller-receiver/bin/opencollate" sequential verify-certificate examples/controller/fsm-request.json "$EVIDENCE/fsm-proof.json" --output "$EVIDENCE/fsm-verified.json"
      - name: Retain measured validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controller-upgrade-validation
          path: ${{ runner.temp }}/controller-evidence
          retention-days: 14
          if-no-files-found: warn
      - name: Publish validated source without temporary transport
        run: |
          test "$GITHUB_REF_NAME" = upgrade/hierarchical-controller-proofs
          rm -rf tools/controller-patch
          rm -f tools/apply_controller_upgrade.py
          rm -f .github/workflows/prepare-controller-validation.yml .github/workflows/apply-controller-upgrade.yml
          git diff --check
          git add -A
          git diff --cached --stat
          git config user.name 'OpenCollate verified controller upgrade'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: verify hierarchical controllers with full-model proof certificates'
          git push origin "HEAD:$GITHUB_REF_NAME"
