name: Independent proof certificates

on:
  push:
    branches: [main, upgrade/independent-proof-certificates]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-certificates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  certificate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip freeze --exclude-editable > proof-requirements.txt
      - name: Run the complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q --junitxml=proof-tests.xml | tee proof-tests.log
      - name: Check formatting and types
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Measure source-bound certificates and explicit negative cases
        run: python -m benchmarks.certificates --repeat 3 --json-output certificate-results.json
      - name: Verify in an independent solver-free installation
        run: |
          opencollate sequential certify examples/sequential/request.json --output example-certificate.json
          python -m venv /tmp/opencollate-proof-receiver
          /tmp/opencollate-proof-receiver/bin/python -m pip install .
          /tmp/opencollate-proof-receiver/bin/python -I -c "import importlib.util; assert importlib.util.find_spec('pysat') is None; assert importlib.util.find_spec('z3') is None"
          /tmp/opencollate-proof-receiver/bin/opencollate sequential verify-certificate examples/sequential/request.json example-certificate.json --output example-verified.json
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-certificate-validation
          path: |
            proof-requirements.txt
            proof-tests.xml
            proof-tests.log
            certificate-results.json
            example-certificate.json
            example-verified.json
          if-no-files-found: warn
          retention-days: 14
