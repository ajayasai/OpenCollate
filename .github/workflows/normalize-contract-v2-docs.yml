name: Normalize contract v2 documentation

on:
  push:
    branches:
      - "feat/contract-v2"

permissions:
  contents: write

concurrency:
  group: normalize-contract-v2-docs
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Restore mainline docs and apply focused additions
        run: |
          git show origin/main:README.md > README.md
          git show origin/main:CHANGELOG.md > CHANGELOG.md
          python tools/restore_contract_v2_docs.py
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Static quality gates
        run: |
          ruff format --check src tests
          ruff check src tests
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
          git diff --check
      - name: Run full tests with explicit exit capture
        run: |
          set +e
          pytest -q > contract-v2-final-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > contract-v2-final-tests.status
          exit 0
      - name: Upload retained transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-v2-final-tests
          path: |
            contract-v2-final-tests.log
            contract-v2-final-tests.status
          retention-days: 1
      - name: Enforce full-suite result
        run: test "$(cat contract-v2-final-tests.status)" -eq 0
      - name: Remove one-shot normalization files
        run: |
          rm -f .github/workflows/normalize-contract-v2-docs.yml
          rm -f tools/restore_contract_v2_docs.py
          rm -f contract-v2-final-tests.log contract-v2-final-tests.status
      - name: Commit focused documentation diff
        run: |
          git config user.name "OpenCollate contract documentation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: document complete contract schema v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
