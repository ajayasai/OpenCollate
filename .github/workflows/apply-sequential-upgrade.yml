name: Validate and publish source-bound upgrade

on:
  push:
    branches: [feat/source-bound-sequential-verification]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

concurrency:
  group: source-bound-upgrade-implementation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify and apply exact tested patch
        run: python tools/apply_sequential_upgrade.py
      - name: Install checker and independent simulator
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Static checks
        run: |
          ruff format --check src tests benchmarks/sequential.py benchmarks/incremental.py benchmarks/upstream_cells.py
          ruff check src tests benchmarks/sequential.py benchmarks/incremental.py benchmarks/upstream_cells.py
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
          git diff --check
      - name: Full tests and branch-aware coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-bound-evidence"
          pytest -q --cov=opencollate --cov-branch --cov-report=term --cov-fail-under=85 | tee "$RUNNER_TEMP/source-bound-evidence/tests.log"
          python -O -m pytest -q | tee "$RUNNER_TEMP/source-bound-evidence/optimized.log"
      - name: Independent simulator and native-language oracles
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_sequential_oracles.py | tee "$RUNNER_TEMP/source-bound-evidence/independent-oracles.log"
      - name: Regression and performance corpora
        run: |
          python benchmarks/sequential.py --repeat 3 --json-output "$RUNNER_TEMP/source-bound-evidence/sequential.json"
          python benchmarks/mutations.py --enforce-perfect --json-output "$RUNNER_TEMP/source-bound-evidence/mutations.json"
          python benchmarks/symbolic.py --json-output "$RUNNER_TEMP/source-bound-evidence/symbolic.json"
          python benchmarks/run.py --repeat 2 --warmup 1 --diff-groups 1000 --enforce-budgets --json-output "$RUNNER_TEMP/source-bound-evidence/conformance.json"
          python benchmarks/upstream_cells.py --json-output "$RUNNER_TEMP/source-bound-evidence/upstream-cells.json"
          python benchmarks/incremental.py --cells 512 --table-rows 512 --repeat 3 --json-output "$RUNNER_TEMP/source-bound-evidence/incremental.json"
      - name: CLI receipt replay and supervised verification
        run: |
          opencollate sequential check examples/sequential/request.json --output "$RUNNER_TEMP/source-bound-evidence/receipt.json"
          opencollate sequential replay examples/sequential/request.json "$RUNNER_TEMP/source-bound-evidence/receipt.json" --output "$RUNNER_TEMP/source-bound-evidence/replayed.json"
          opencollate guard --wall-seconds 30 --status-output "$RUNNER_TEMP/source-bound-evidence/guard-status.json" -- sequential check examples/sequential/request.json --output "$RUNNER_TEMP/source-bound-evidence/guard-receipt.json"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bound-upgrade-validation
          path: ${{ runner.temp }}/source-bound-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary transport and publish validated source
        run: |
          test "$GITHUB_REF_NAME" = "feat/source-bound-sequential-verification"
          rm -rf tools/seq-patch tools/sequential-upgrade
          rm -f tools/apply_sequential_upgrade.py .github/workflows/apply-sequential-upgrade.yml
          git diff --check
          git add -A
          git diff --cached --stat
          git config user.name "OpenCollate verified upgrade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: source-bound sequential proofs, trace replay, cache and guarded execution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
