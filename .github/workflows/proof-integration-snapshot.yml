name: Proof integration snapshot
on:
  push:
    branches: [feat/independent-proof-certificates]
    paths: [.github/workflows/proof-integration-snapshot.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97251903fc27cccc81b3d56f267fa8e4646dfb0d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Preserve both certificate engines and their public interfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.email 'opencollate-dev@users.noreply.github.com'
          git config user.name 'OpenCollate development'
          git mv src/opencollate/proof_kernel.py src/opencollate/boolean_proof_kernel.py
          git mv tests/test_proof_kernel.py tests/test_boolean_proof_kernel.py
          git mv benchmarks/certificates.py benchmarks/boolean_certificates.py
          python - <<'PY'
          from pathlib import Path
          for root in ['src','tests','benchmarks','docs','.github']:
              for p in Path(root).rglob('*'):
                  if p.suffix not in {'.py','.md','.yml','.yaml','.json'}: continue
                  text=p.read_text()
                  out=text.replace('opencollate.proof_kernel','opencollate.boolean_proof_kernel').replace('tests/test_proof_kernel.py','tests/test_boolean_proof_kernel.py').replace('benchmarks.certificates','benchmarks.boolean_certificates').replace('`proof_kernel.py`','`boolean_proof_kernel.py`')
                  if out!=text: p.write_text(out)
          for name in ('README.md','CHANGELOG.md'):
              p=Path(name);p.write_text(p.read_text().replace('benchmarks.certificates','benchmarks.boolean_certificates'))
          PY
          git add .
          git commit -m 'Namespace standalone Boolean certificate internals'
          git merge --no-commit --no-ff 58e724148f5d29a98f641abeca51bcd4b2fd5ae7 || test "$?" -eq 1
          python - <<'PY'
          import re
          from pathlib import Path
          pat=re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n',re.S)
          for name in ['CHANGELOG.md','benchmarks/README.md','docs/competitive-scorecard.md','pyproject.toml','src/opencollate/cli.py']:
              p=Path(name)
              def resolve(m):
                  a,b=m.groups()
                  if name in ['pyproject.toml','docs/competitive-scorecard.md']: return b
                  if name=='src/opencollate/cli.py': return a+'        },\n'+b
                  return a+'\n'+b
              out,n=pat.subn(resolve,p.read_text())
              if n!=1: raise RuntimeError(f'unexpected conflict count for {name}: {n}')
              p.write_text(out)
          Path('.github/workflows/proof-integration-snapshot.yml').unlink()
          p=Path('benchmarks/boolean_certificates.py')
          p.write_text(p.read_text().replace('"proof_kernel.py",','"boolean_proof_kernel.py",').replace('"certificates.py",','"certificates.py",\n                    "certificate_process.py",\n                    "_certificate_worker.py",'))
          PY
          python -m pip install -e '.[dev]' 'ruff==0.16.6'
          ruff check --fix .
          ruff format .
          git add -A
          test "$(git write-tree)" = ec42d4e59cdca4c809a961d272100121b8b5ca7a
          git diff --check --cached
      - name: Validate both CLI paths before preparing immutable objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencollate-integration-evidence
          ruff check .
          ruff format --check .
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
          pytest -q tests/test_boolean_proof_kernel.py tests/test_proof_cnf.py tests/test_certificates.py tests/test_certificate_process.py tests/test_certificate_integration.py tests/test_certificate_benchmarks.py --junitxml=/tmp/opencollate-integration-evidence/focused-tests.xml | tee /tmp/opencollate-integration-evidence/focused-tests.log
          opencollate sequential certify examples/sequential/request.json --output /tmp/opencollate-integration-evidence/sequential-certificate.json
          opencollate sequential verify-certificate examples/sequential/request.json /tmp/opencollate-integration-evidence/sequential-certificate.json --output /tmp/opencollate-integration-evidence/sequential-verified.json
          git diff --quiet
      - name: Prepare Git objects only; repository connector must publish the reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          base='97251903fc27cccc81b3d56f267fa8e4646dfb0d'
          expected='ec42d4e59cdca4c809a961d272100121b8b5ca7a'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def post(endpoint,payload):
              request=urllib.request.Request('https://api.github.com/repos/ajayasai/OpenCollate/git/'+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          if git('write-tree')!=expected: raise RuntimeError('tested tree changed')
          entries=[]
          for line in git('diff','--cached','--name-status','--no-renames',base).splitlines():
              status,path=line.split('\t')
              if status=='D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,sha,stage=git('ls-files','--stage','--',path).split('\t')[0].split()
              raw=subprocess.check_output(['git','show',':'+path])
              actual=post('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              if actual!=sha: raise RuntimeError('blob mismatch: '+path)
              entries.append({'path':path,'mode':mode,'type':'blob','sha':actual})
          tree=post('trees',{'base_tree':git('rev-parse',base+'^{tree}'),'tree':entries})['sha']
          if tree!=expected: raise RuntimeError('published tree mismatch')
          result={'tree_sha':tree,'feature_parent':os.environ['GITHUB_SHA'],'main_parent':'58e724148f5d29a98f641abeca51bcd4b2fd5ae7','branch_updated':False}
          root=Path('/tmp/opencollate-integration-evidence')
          (root/'tree.json').write_text(json.dumps(result,indent=2)+'\n')
          (root/'integration.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary',base]))
          subprocess.check_call(['git','archive','--format=tar.gz','--output='+str(root/'source.tar.gz'),tree])
          print(json.dumps(result))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proof-integration-evidence
          path: /tmp/opencollate-integration-evidence/
          retention-days: 7
          if-no-files-found: error
