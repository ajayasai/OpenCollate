name: Proof integration snapshot
on:
  push:
    branches: [feat/independent-proof-certificates]
    paths: [.github/workflows/proof-integration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact committed source histories
        run: git bundle create repository.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-integration-source
          path: repository.bundle
          retention-days: 1
          if-no-files-found: error
