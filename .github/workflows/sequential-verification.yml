name: Source-bound sequential verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

jobs:
  independent-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install checker and independent simulator
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Run native semantics and simulator oracles
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_sequential.py tests/test_sequential_oracles.py | tee sequential-tests.log
      - name: Verify source-file proof and mutation corpus
        run: python benchmarks/sequential.py --repeat 3 --json-output sequential-results.json
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bound-sequential-evidence
          path: |
            sequential-tests.log
            sequential-results.json
          if-no-files-found: warn
          retention-days: 14
