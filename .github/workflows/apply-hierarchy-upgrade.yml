name: Validate hierarchical proof cones

on:
  push:
    branches: [feat/hierarchical-proof-cones]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  OPENCOLLATE_DISABLE_PLUGINS: "1"

concurrency:
  group: apply-hierarchy-upgrade
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Apply exact tested source
        run: python tools/apply_hierarchy_upgrade.py
      - name: Install checker and independent simulator
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Static quality and security
        run: |
          ruff format --check src tests benchmarks/hierarchy.py
          ruff check src tests benchmarks/hierarchy.py
          mypy src/opencollate
          python -m bandit -q -r src/opencollate
      - name: Full regression and coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hierarchy-evidence"
          pytest -q --cov=opencollate --cov-branch --cov-report=term --cov-fail-under=85 | tee "$RUNNER_TEMP/hierarchy-evidence/tests.log"
          python -O -m pytest -q | tee "$RUNNER_TEMP/hierarchy-evidence/optimized.log"
          pytest -q tests/test_sequential_hierarchy_oracles.py | tee "$RUNNER_TEMP/hierarchy-evidence/independent-oracles.log"
      - name: Public correctness and performance corpora
        run: |
          python benchmarks/hierarchy.py --tiers 0,16,64,128 --repeat 3 --json-output "$RUNNER_TEMP/hierarchy-evidence/hierarchy.json"
          python benchmarks/sequential.py --repeat 3 --json-output "$RUNNER_TEMP/hierarchy-evidence/sequential.json"
          python benchmarks/mutations.py --enforce-perfect --json-output "$RUNNER_TEMP/hierarchy-evidence/mutations.json"
          python benchmarks/symbolic.py --json-output "$RUNNER_TEMP/hierarchy-evidence/symbolic.json"
          python benchmarks/upstream_cells.py --json-output "$RUNNER_TEMP/hierarchy-evidence/upstream.json"
          python benchmarks/run.py --repeat 1 --warmup 0 --diff-groups 1000 --enforce-budgets --json-output "$RUNNER_TEMP/hierarchy-evidence/conformance.json"
      - name: CLI proof replay and failure boundaries
        shell: bash
        run: |
          set -euo pipefail
          opencollate sequential check examples/hierarchy/request.json --output "$RUNNER_TEMP/hierarchy-evidence/receipt.json"
          opencollate sequential replay examples/hierarchy/request.json "$RUNNER_TEMP/hierarchy-evidence/receipt.json" --output "$RUNNER_TEMP/hierarchy-evidence/replayed.json"
          opencollate sequential check examples/hierarchy/request.json --no-cone-reduction --output "$RUNNER_TEMP/hierarchy-evidence/reference.json"
          set +e
          opencollate sequential check examples/hierarchy/request-mutant.json --output "$RUNNER_TEMP/hierarchy-evidence/counterexample.json"
          status=$?
          set -e
          test "$status" -eq 1
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hierarchical-proof-cones-validation
          path: ${{ runner.temp }}/hierarchy-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified source without temporary transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/hierarchical-proof-cones"
          rm -rf tools/hierarchy-upgrade
          rm -f tools/apply_hierarchy_upgrade.py .github/workflows/apply-hierarchy-upgrade.yml
          git diff --check
          git add -A
          git diff --cached --stat
          git config user.name "OpenCollate verified hierarchy upgrade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: verify hierarchical RTL with dependency-closed proof cones"
          git push origin "HEAD:${GITHUB_REF_NAME}"
