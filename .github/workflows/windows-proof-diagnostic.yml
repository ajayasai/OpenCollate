name: Windows proof transport diagnostic
on:
  push:
    branches: [feat/independent-proof-certificates]
    paths: [.github/workflows/windows-proof-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[certificates]'
      - name: Compare native proof before and after runtime flush
        shell: python
        run: |
          import ctypes, json
          from pysat.solvers import Glucose3
          from opencollate.certificates import certify_boolean
          cnf = [[1, 2], [-1, 2], [1, -2], [-1, -2]]
          with Glucose3(bootstrap_with=cnf, with_proof=True) as s:
              print('answer', s.solve())
              print('before', repr(s.get_proof()))
              crt = ctypes.CDLL('ucrtbase.dll', winmode=0x800)
              crt.fflush.argtypes = [ctypes.c_void_p]
              crt.fflush.restype = ctypes.c_int
              print('flush', crt.fflush(None))
              print('after', repr(s.get_proof()))
          original = Glucose3.get_proof
          def flushed(self):
              if crt.fflush(None) != 0:
                  raise RuntimeError('native flush failed')
              return original(self)
          Glucose3.get_proof = flushed
          for left, right in [('!(A&B)', '!A|!B'), ('A^B^C', 'C^A^B'), ('A', 'B')]:
              print(json.dumps(certify_boolean(left, right)))
