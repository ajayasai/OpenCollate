name: Validate and publish tested Boolean certificate upgrade
on:
  push:
    branches: [feat/independent-proof-certificates]
    paths: [.github/workflows/apply-proof-upgrade.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'ajayasai/OpenCollate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE: ${{ runner.temp }}/proof-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and apply the exact locally tested source patch
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          python - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          compressed = b''.join(Path(f'.development/proof-patch.part{i}').read_bytes() for i in range(4))
          if hashlib.sha256(compressed).hexdigest() != 'b2109e2bb9631dffd60994a23a4260a3c919bf20a8f7edf850a3a5a60d3e7127':
              raise SystemExit('compressed transport digest mismatch')
          patch = lzma.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != '37bd35b9446dd74e7fd36baad501968aba281469747a4873a8054f16fd42c17b':
              raise SystemExit('source patch digest mismatch')
          Path(os.environ['EVIDENCE'], 'source.patch').write_bytes(patch)
          PY
          git apply --check "$EVIDENCE/source.patch"
          git apply "$EVIDENCE/source.patch"
          rm .development/proof-patch.part{0,1,2,3}
          rmdir .development
          rm .github/workflows/apply-proof-upgrade.yml
          git add -A
          git -c core.abbrev=7 diff --cached --binary c62507c5b7f30a3c0388c2ce4089618931613aab > "$EVIDENCE/reconstructed.patch"
          cmp "$EVIDENCE/source.patch" "$EVIDENCE/reconstructed.patch"
          git diff --cached --check
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Quality and security gates
        shell: bash
        run: |
          set -o pipefail
          { ruff format --check .; ruff check .; mypy src/opencollate; python -m bandit -q -r src/opencollate; } 2>&1 | tee "$EVIDENCE/quality.log"
      - name: Full tests and unchanged coverage gate
        shell: bash
        run: |
          set -o pipefail
          pytest -q --cov=opencollate --cov-branch --cov-report=term --cov-report=json:"$EVIDENCE/coverage.json" 2>&1 | tee "$EVIDENCE/tests-coverage.log"
          python -O -m pytest -q 2>&1 | tee "$EVIDENCE/tests-optimized.log"
      - name: Reproducible certificate and existing mutation benchmarks
        shell: bash
        run: |
          python -m benchmarks.certificates --repeat 5 --json-output "$EVIDENCE/certificates.json" --export-dir "$EVIDENCE/exports"
          python -m benchmarks.mutations --enforce-perfect --json-output "$EVIDENCE/mutations.json"
          python -m benchmarks.symbolic --json-output "$EVIDENCE/symbolic.json"
      - name: Check proofs with pinned independent DRAT-trim
        shell: bash
        run: |
          git clone --quiet https://github.com/marijnheule/drat-trim.git "$RUNNER_TEMP/drat-trim"
          git -C "$RUNNER_TEMP/drat-trim" checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C "$RUNNER_TEMP/drat-trim" drat-trim
          count=0
          for cnf in "$EVIDENCE"/exports/*.cnf; do
            "$RUNNER_TEMP/drat-trim/drat-trim" "$cnf" "${cnf%.cnf}.rup" -f -t 30 > "${cnf%.cnf}.drat-trim.log" 2>&1
            grep -q 's VERIFIED' "${cnf%.cnf}.drat-trim.log"
            count=$((count + 1))
          done
          test "$count" -eq 7
          echo "$count independently verified UNSAT proofs" | tee "$EVIDENCE/independent-checker.txt"
      - name: Installed wheel with neither native solver
        shell: bash
        run: |
          python -m build
          twine check dist/*
          python -m venv "$RUNNER_TEMP/solver-free-wheel"
          "$RUNNER_TEMP/solver-free-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/solver-free-wheel/bin/python" -c "import importlib.util; assert importlib.util.find_spec('pysat') is None; assert importlib.util.find_spec('z3') is None"
          "$RUNNER_TEMP/solver-free-wheel/bin/opencollate" formal verify-certificate "$EVIDENCE/exports/parity-permutation.request.json" "$EVIDENCE/exports/parity-permutation.certificate.json" --output "$EVIDENCE/installed-wheel-verification.json"
      - name: Publish only the verified source and permanent tests
        shell: bash
        run: |
          git status --short
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add independently checked Boolean certificates and fix incomplete-function false pass'
          git push origin HEAD:feat/independent-proof-certificates
          git rev-parse HEAD > "$EVIDENCE/source-commit.txt"
          git archive --format=tar.gz --output="$EVIDENCE/source.tar.gz" HEAD
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checked-boolean-certificate-validation
          path: ${{ env.EVIDENCE }}
          retention-days: 14
          if-no-files-found: error
