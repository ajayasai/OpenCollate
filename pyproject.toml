[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opencollate"
version = "0.1.0"
description = "Open-source SoC design-collateral consistency checker"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ajayasai" }]
keywords = [
  "asic",
  "design-collateral",
  "eda",
  "hardware-verification",
  "lef",
  "liberty",
  "soc",
  "systemverilog",
  "verilog",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pyslang>=11,<12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hypothesis>=6.120",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[project.scripts]
opencollate = "opencollate.cli:main"

[project.urls]
Changelog = "https://github.com/ajayasai/OpenCollate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ajayasai/OpenCollate#readme"
Issues = "https://github.com/ajayasai/OpenCollate/issues"
Source = "https://github.com/ajayasai/OpenCollate"

[tool.hatch.build.targets.wheel]
packages = ["src/opencollate"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
minversion = "8.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opencollate"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/opencollate"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyslang", "pyslang.*"]
ignore_missing_imports = true
